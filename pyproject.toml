[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omegaserve"
version = "0.1.0"
description = "Interfaces for configuration-driven service hosting built on OmegaConf/Hydra."
authors = [{name = "OmegaServe Maintainers"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"

[project.urls]
Homepage = "https://example.com/omegaserve"

[project.scripts]
omgserve = "omegaserve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "omegaserve.__version__"}
dependencies = {file = ["requirements.txt"]}
